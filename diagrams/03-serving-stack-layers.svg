<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-title stack-desc" id="d-03-serving-stack-layers-root">
        <title id="stack-title">Capas de un servidor vLLM y la unidad que cubre cada una</title>
        <desc id="stack-desc">Seis capas de arriba abajo, aplicación, API compatible con OpenAI, scheduler con continuous batching, memoria con KV-cache en bloques, pesos del modelo y GPU en Cloud Run, cada una con la unidad del Field Guide de vLLM donde se estudia.</desc>
