<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c0-decision-title c0-decision-desc" id="d-02-api-or-own-server-root">
        <title id="c0-decision-title">Cuándo conviene una API y cuándo un servidor vLLM propio</title>
        <desc id="c0-decision-desc">Si los datos no pueden salir de tu proyecto, el camino es vLLM; si pueden, decide el volumen diario de GPU y la necesidad de fijar o adaptar el modelo, y en los demás casos conviene la API administrada.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-api-or-own-server-root { font-family: 'Geist', system-ui, sans-serif; color: #0F2547; }
      #d-02-api-or-own-server-root .diagram-container { width: 100%; overflow-x: auto; }</style>
          <marker id="d-02-api-or-own-server-c0d-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/></marker>
          <marker id="d-02-api-or-own-server-c0d-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C59216"/></marker>
        </defs>
        <rect width="1040" height="460" fill="#F7F6F2"/>

        <!-- Connectors: questions chain (yes, right), no goes down to API -->
        <line x1="272" y1="128" x2="340" y2="128" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-02-api-or-own-server-c0d-arrow)"/>
        <line x1="584" y1="128" x2="652" y2="128" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-02-api-or-own-server-c0d-arrow)"/>
        <path d="M 896 128 L 932 128 Q 940 128 940 136 L 940 244" fill="none" stroke="#C59216" stroke-width="1.5" marker-end="url(#d-02-api-or-own-server-c0d-arrow-accent)"/>
        <path d="M 200 80 L 200 60 Q 200 52 208 52 L 972 52 Q 980 52 980 60 L 980 244" fill="none" stroke="#C59216" stroke-width="1.5" marker-end="url(#d-02-api-or-own-server-c0d-arrow-accent)"/>
        <path d="M 464 176 L 464 196 Q 464 204 456 204 L 180 204 Q 172 204 172 212 L 172 244" fill="none" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-02-api-or-own-server-c0d-arrow)"/>
        <path d="M 776 176 L 776 216 Q 776 224 768 224 L 200 224 Q 192 224 192 232 L 192 244" fill="none" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-02-api-or-own-server-c0d-arrow)"/>

        <!-- Labels -->
        <rect x="290" y="104" width="24" height="12" rx="2" fill="#F7F6F2"/>
        <text x="302" y="113" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SÍ</text>
        <rect x="604" y="104" width="24" height="12" rx="2" fill="#F7F6F2"/>
        <text x="616" y="113" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SÍ</text>
        <rect x="904" y="104" width="24" height="12" rx="2" fill="#F7F6F2"/>
        <text x="916" y="113" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SÍ</text>
        <rect x="576" y="32" width="24" height="12" rx="2" fill="#F7F6F2"/>
        <text x="588" y="41" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
        <rect x="476" y="180" width="24" height="12" rx="2" fill="#F7F6F2"/>
        <text x="488" y="189" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
        <rect x="788" y="192" width="24" height="12" rx="2" fill="#F7F6F2"/>
        <text x="800" y="201" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

        <!-- Q1 -->
        <rect x="32" y="80" width="240" height="96" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="48" y="102" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">1 · DATOS</text>
        <text x="48" y="126" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">¿Tus datos pueden salir</text>
        <text x="48" y="142" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">de tu proyecto?</text>
        <text x="48" y="162" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">contratos, salud, banca</text>

        <!-- Q2 -->
        <rect x="344" y="80" width="240" height="96" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="360" y="102" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">2 · VOLUMEN</text>
        <text x="360" y="126" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">¿Llenas varias horas</text>
        <text x="360" y="142" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">de GPU cada día?</text>
        <text x="360" y="162" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">make calc en el Field Guide</text>

        <!-- Q3 -->
        <rect x="656" y="80" width="240" height="96" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="672" y="102" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">3 · CONTROL</text>
        <text x="672" y="126" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">¿Necesitas fijar o</text>
        <text x="672" y="142" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">adaptar el modelo?</text>
        <text x="672" y="162" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">versión exacta, LoRA</text>

        <!-- Outcome API -->
        <rect x="32" y="248" width="240" height="88" rx="6" fill="#0f2547" fill-opacity="0.03" stroke="#0f2547" stroke-opacity="0.30" stroke-width="1"/>
        <text x="48" y="270" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">API ADMINISTRADA</text>
        <text x="48" y="294" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Pagas por token</text>
        <text x="48" y="314" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">cero operación, modelos grandes</text>

        <!-- Outcome vLLM (focal) -->
        <rect x="820" y="248" width="200" height="88" rx="6" fill="#c59216" fill-opacity="0.10" stroke="#C59216" stroke-width="1.2"/>
        <text x="836" y="270" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VLLM PROPIO</text>
        <text x="836" y="294" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Pagas por hora de GPU</text>
        <text x="836" y="314" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">Serie C, de C1 a C5</text>

        <text x="32" y="384" fill="#3B5B8C" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Si los datos no pueden salir, vas directo a tu propio servidor.</text>

        <line x1="32" y1="416" x2="1008" y2="416" stroke="#0f2547" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="32" y="436" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <line x1="112" y1="433" x2="140" y2="433" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="148" y="436" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">camino posible, revisa tus números</text>
        <rect x="372" y="428" width="12" height="10" rx="2" fill="#c59216" fill-opacity="0.10" stroke="#C59216"/>
        <text x="390" y="436" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">lo que cubre esta serie</text>
      </svg>
